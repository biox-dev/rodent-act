[package]
name = "rodent-act"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["json", "query"] }
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
half = "2.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.17"
nalgebra = "0.33"
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "load-dynamic",
    "ndarray",
] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `ort` (ONNX Runtime) ships its own release build; compiling it in debug mode
# makes YOLO inference unusably slow. Optimise dependencies even for `cargo run`.
[profile.dev.package."*"]
opt-level = 2

